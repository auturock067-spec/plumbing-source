name: Static website smoke check
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static source checks
        run: node --test test/site.test.mjs
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Chromium test tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Chromium mobile and desktop acceptance
        run: node --test test/browser.test.mjs
      - name: Save viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-viewport-evidence
          path: artifacts/
          if-no-files-found: ignore
